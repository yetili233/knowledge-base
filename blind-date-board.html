<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息收集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3A2145;
    --muted:#8B6B96;
    --bg:#FFF3E9;
    --panel:#FFFFFF;
    --panel-line: rgba(58,33,69,0.10);
    --gold:#FFA53D;
    --coral:#FF4E80;
    --nt:#8C52FF;   /* 分析家 紫 */
    --nf:#12B76A;   /* 外交家 绿 */
    --sj:#2E90FA;   /* 守护者 蓝 */
    --sp:#FF8A3D;   /* 探险家 橙 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,165,61,0.22), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,78,128,0.18), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(140,82,255,0.14), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans SC', sans-serif;
    padding:0 0 60px;
  }
  .display{font-family:'Noto Serif SC', serif; font-weight:900;}
  .mono{font-family:'JetBrains Mono', monospace;}

  header{
    text-align:center; padding:48px 20px 30px;
  }
  header h1{
    font-size:34px; margin:0 0 8px; letter-spacing:2px;
    background:linear-gradient(90deg, var(--coral), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{color:var(--muted); font-size:13px; letter-spacing:3px; text-transform:uppercase; margin:0;}
  .divider{width:80px; height:3px; background:linear-gradient(90deg, var(--coral), var(--gold)); margin:18px auto 0; border-radius:2px;}

  main{max-width:1100px; margin:0 auto; padding:0 20px;}

  /* ---------- Table (desktop) ---------- */
  .board{width:100%; border-collapse:separate; border-spacing:0 16px;}
  .board thead th{
    text-align:left; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--muted); padding:0 16px 8px; font-weight:600;
  }
  .board tbody tr{background:var(--panel); box-shadow:0 10px 26px rgba(58,33,69,0.14);}
  .board tbody td{padding:20px 16px; border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line); vertical-align:top;}
  .board tbody td:first-child{border-left:1px solid var(--panel-line); border-radius:14px 0 0 14px;}
  .board tbody td:last-child{border-right:1px solid var(--panel-line); border-radius:0 14px 14px 0;}

  .code-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:50%;
    font-family:'Noto Serif SC'; font-weight:900; font-size:20px;
    background:linear-gradient(135deg, var(--coral), var(--gold)); color:#FFFFFF;
    box-shadow:0 6px 14px rgba(255,78,128,0.35);
  }
  .nickname{font-size:12px; color:var(--muted); margin-top:6px;}

  .stat-line{display:flex; gap:14px; margin-bottom:8px; flex-wrap:wrap;}
  .stat{font-size:13px;}
  .stat b{font-family:'JetBrains Mono'; font-size:15px; color:var(--coral);}
  .mbti-badge{
    display:inline-block; padding:3px 10px; border-radius:999px; font-family:'JetBrains Mono';
    font-weight:700; font-size:12px; color:#FFFFFF;
  }
  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag{background:rgba(140,82,255,0.08); border:1px solid var(--panel-line); padding:3px 10px; border-radius:999px; font-size:11px; color:#6B4776;}

  .req-block{font-size:13px; line-height:1.9;}
  .req-block .label{color:var(--muted); font-size:13px; margin-right:6px;}
  .req-block .empty{color:#B8A2C0; font-style:italic;}
  .dealbreaker-tag{color:var(--coral); font-weight:600;}

  /* ---------- Mobile card fallback ---------- */
  @media (max-width: 760px){
    .board thead{display:none;}
    .board, .board tbody, .board tbody tr, .board tbody td{display:block; width:100%;}
    .board tbody tr{border-radius:16px; padding:18px; margin-bottom:18px;}
    .board tbody td{border:none !important; padding:6px 0;}
    .board tbody td::before{
      content:attr(data-label); display:block; font-size:10px; letter-spacing:1.5px;
      color:#B499BE; text-transform:uppercase; margin-bottom:4px;
    }
  }

  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:40px;}

  /* ---------- Add / edit / delete controls ---------- */
  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .icon-btn{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--panel-line);
    background:rgba(58,33,69,0.05); color:var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; font-size:13px;
    transition:background .15s;
  }
  .icon-btn:hover{background:rgba(58,33,69,0.12);}
  .icon-btn.danger:hover{background:rgba(255,78,128,0.16); color:var(--coral);}

  .fab{
    position:fixed; right:28px; bottom:28px; width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg, var(--coral), var(--gold)); color:#FFFFFF;
    border:none; font-size:26px; font-weight:900; cursor:pointer; z-index:50;
    box-shadow:0 10px 24px rgba(255,78,128,0.4);
  }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(58,33,69,0.5);
    z-index:100; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:16px;
    width:100%; max-width:520px; padding:26px; box-shadow:0 20px 50px rgba(58,33,69,0.3);
  }
  .modal h2{margin:0 0 18px; font-size:18px; font-family:'Noto Serif SC';}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-grid .full{grid-column:1 / -1;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:11px; letter-spacing:0.5px; color:var(--muted); text-transform:uppercase;}
  .field input, .field textarea{
    background:rgba(58,33,69,0.04); border:1px solid var(--panel-line); border-radius:8px;
    color:var(--ink); padding:8px 10px; font-family:inherit; font-size:13px;
  }
  .field textarea{resize:vertical; min-height:38px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:8px;}
  .btn{
    padding:9px 18px; border-radius:999px; border:none; cursor:pointer; font-size:13px; font-weight:600;
  }
  .btn-primary{background:linear-gradient(90deg, var(--coral), var(--gold)); color:#FFFFFF;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--panel-line);}
  .hint{font-size:11px; color:var(--muted); margin:-6px 0 12px;}
  .db-status{position:fixed; left:20px; bottom:20px; font-size:11px; color:var(--muted); z-index:50;}

  .fab-secondary{
    position:fixed; right:28px; bottom:96px; width:44px; height:44px; border-radius:50%;
    background:var(--panel); color:var(--ink); border:1px solid var(--panel-line);
    font-size:18px; cursor:pointer; z-index:50; box-shadow:0 8px 20px rgba(58,33,69,0.2);
  }

  .field-manage-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .field-manage-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(58,33,69,0.04); border:1px solid var(--panel-line); border-radius:8px; padding:8px 12px;
  }
  .field-manage-row span{font-size:13px;}
  .add-field-row{display:flex; gap:8px;}
  .add-field-row input{flex:1;}
</style>
</head>
<body>

<header>
  <h1 class="display">信息收集</h1>
  <p>Information Collection</p>
  <div class="divider"></div>
</header>

<main>
  <table class="board" id="board">
    <thead>
      <tr>
        <th style="width:8%">编号</th>
        <th style="width:20%">基本信息</th>
        <th style="width:20%">人设 / 标签</th>
        <th style="width:26%">择偶要求</th>
        <th style="width:26%">更多信息</th>
      </tr>
    </thead>
    <tbody id="boardBody"></tbody>
  </table>
</main>

<footer>数据已接入数据库，点右下角「+」新增，每行「编号」下方可编辑 / 删除</footer>

<button class="fab" id="addBtn" title="新增一位">+</button>
<button class="fab-secondary" id="manageFieldsBtn" title="管理字段">⚙</button>
<div class="db-status" id="dbStatus">连接数据库中…</div>

<div class="modal-overlay" id="fieldsModalOverlay">
  <div class="modal">
    <h2>管理字段</h2>
    <div class="field-manage-list" id="fieldManageList"></div>
    <div class="add-field-row">
      <input type="text" id="newFieldLabel" placeholder="新字段名称，例如：恋爱经历">
      <button type="button" class="btn btn-primary" id="addFieldBtn">添加</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="closeFieldsBtn">关闭</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增一位</h2>
    <form id="profileForm">
      <div class="field-grid">
        <div class="field"><label>编号 *</label><input name="code" required maxlength="4"></div>
        <div class="field"><label>昵称</label><input name="nickname"></div>
        <div class="field"><label>出生年份</label><input name="birthYear"></div>
        <div class="field"><label>身高 (cm)</label><input name="height"></div>
        <div class="field"><label>MBTI</label><input name="mbti" maxlength="4"></div>
        <div class="field"><label>星座</label><input name="zodiac"></div>
        <div class="field"><label>坐标城市</label><input name="city"></div>
        <div class="field"><label>职业方向</label><input name="job"></div>
        <div class="field full"><label>人设标签（逗号分隔）</label><input name="tags"></div>
        <div class="field full"><label>兴趣关键词（逗号分隔）</label><input name="interests"></div>
        <div class="field"><label>期望年龄段</label><input name="reqAgeRange" placeholder="例如 90-97"></div>
        <div class="field"><label>期望身高下限</label><input name="reqHeightMin"></div>
        <div class="field full"><label>气质要求</label><input name="reqVibe"></div>
        <div class="field full"><label>加分项（逗号分隔）</label><input name="bonus"></div>
        <div class="field full"><label>雷区（逗号分隔）</label><input name="dealbreaker"></div>
      </div>
      <div class="field-grid" id="customFieldsContainer"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getDatabase, ref, push, update, remove, onValue, get
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCU2RWRACUiDTBduSYgG9meF75hecuwFyk",
  authDomain: "date-a7ab3.firebaseapp.com",
  databaseURL: "https://date-a7ab3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "date-a7ab3",
  storageBucket: "date-a7ab3.firebasestorage.app",
  messagingSenderId: "1079366372169",
  appId: "1:1079366372169:web:4356a283804ed1fb366898"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const profilesRef = ref(db, 'profiles');
const customFieldsRef = ref(db, 'customFields');

/* 首次运行时，如果 profiles 集合还是空的，把下面这几条种子数据写进去，
   之后所有增删改都直接发生在数据库里，这个数组不会再被使用 */
const SEED_PROFILES = [
  { code:'A', nickname:'', birthYear:'1999', height:155, mbti:'ENFP', zodiac:'', city:'', job:'',
    tags:[], interests:[], reqAgeRange:'06-95', reqHeightMin:178, reqVibe:'乖萌', bonus:['闷骚'], dealbreaker:[] },
  { code:'B', nickname:'', birthYear:'1999', height:160, mbti:'ENTJ', zodiac:'', city:'', job:'',
    tags:[], interests:[], reqAgeRange:'06-97', reqHeightMin:180, reqVibe:'帅', bonus:[], dealbreaker:[] },
  { code:'C', nickname:'', birthYear:'2000', height:165, mbti:'ESFP', zodiac:'', city:'', job:'',
    tags:[], interests:[], reqAgeRange:'', reqHeightMin:'', reqVibe:'', bonus:[], dealbreaker:[] }
];

/* 首次运行时的默认自定义字段，之后所有增删字段都直接发生在数据库里 */
const SEED_CUSTOM_FIELDS = ['恋爱经历'];

const MBTI_COLOR = {
  NT:'var(--nt)', NF:'var(--nf)', SJ:'var(--sj)', SP:'var(--sp)'
};
function mbtiGroup(m){
  if(!m) return 'SP';
  const t = m.toUpperCase();
  if(t.includes('NT')) return 'NT';
  if(t.includes('NF')) return 'NF';
  if(/[SJ].*[JP]/.test(t) && (t.includes('SJ')||t[2]==='S'&&t[3]==='J')) return 'SJ';
  if(t[2]==='S' && t[3]==='J') return 'SJ';
  if(t[2]==='S' && t[3]==='P') return 'SP';
  return 'SP';
}

let PROFILES = [];
let CUSTOM_FIELDS = [];

function age(birthYear){
  if(!birthYear) return '';
  return new Date().getFullYear() - parseInt(birthYear);
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function listOrEmpty(arr, cls){
  if(!arr || arr.length===0) return '';
  return arr.map(x=>`<span class="tag ${cls||''}">${esc(x)}</span>`).join('');
}
function lineOrEmpty(text){
  return text ? esc(text) : '<span class="empty">未填写</span>';
}

function customFieldsHTML(p){
  const parts = CUSTOM_FIELDS
    .filter(f => p.custom && p.custom[f.id])
    .map(f => `<div><span class="label">${esc(f.label)}</span>${esc(p.custom[f.id])}</div>`);
  return parts.length ? parts.join('') : '<span class="empty">暂无</span>';
}

function renderRow(p){
  const grp = mbtiGroup(p.mbti);
  const color = MBTI_COLOR[grp];
  const reqParts = [];
  if(p.reqAgeRange) reqParts.push(`<div><span class="label">年龄</span>${esc(p.reqAgeRange)}</div>`);
  if(p.reqHeightMin) reqParts.push(`<div><span class="label">身高</span>${esc(p.reqHeightMin)}+</div>`);
  if(p.reqVibe) reqParts.push(`<div><span class="label">气质</span>${esc(p.reqVibe)}</div>`);
  if(p.bonus && p.bonus.length) reqParts.push(`<div><span class="label">加分</span>${p.bonus.map(esc).join(' / ')}</div>`);
  if(p.dealbreaker && p.dealbreaker.length) reqParts.push(`<div><span class="label">雷区</span><span class="dealbreaker-tag">${p.dealbreaker.map(esc).join(' / ')}</span></div>`);
  const reqHTML = reqParts.length ? reqParts.join('') : '<span class="empty">暂无具体要求</span>';

  const tagHTML = listOrEmpty(p.tags) + listOrEmpty(p.interests);

  return `
  <tr>
    <td data-label="编号">
      <span class="code-badge">${esc(p.code)}</span>
      ${p.nickname ? `<div class="nickname">${esc(p.nickname)}</div>` : ''}
      <div class="row-actions">
        <button class="icon-btn edit-btn" data-id="${p.id}" title="编辑">✎</button>
        <button class="icon-btn danger delete-btn" data-id="${p.id}" title="删除">✕</button>
      </div>
    </td>
    <td data-label="基本信息">
      <div class="stat-line">
        <span class="stat">${age(p.birthYear)?`<b>${age(p.birthYear)}</b>岁`:''} ${p.birthYear?`(${esc(p.birthYear)})`:''}</span>
        <span class="stat"><b>${esc(p.height)}</b>cm</span>
      </div>
      <span class="mbti-badge" style="background:${color}">${esc(p.mbti)}</span>
      ${p.zodiac?`<div class="nickname" style="margin-top:6px;">${esc(p.zodiac)}</div>`:''}
      ${p.city?`<div class="nickname">📍 ${esc(p.city)}</div>`:''}
      ${p.job?`<div class="nickname">💼 ${esc(p.job)}</div>`:''}
    </td>
    <td data-label="人设/标签">
      <div class="tag-row">${tagHTML || '<span class="empty">暂无</span>'}</div>
    </td>
    <td data-label="择偶要求">
      <div class="req-block">${reqHTML}</div>
    </td>
    <td data-label="更多信息">
      <div class="req-block">${customFieldsHTML(p)}</div>
    </td>
  </tr>`;
}

function render(){
  document.getElementById('boardBody').innerHTML = PROFILES.map(renderRow).join('');
}

/* ---------- Realtime Database wiring ---------- */
const dbStatus = document.getElementById('dbStatus');
const boardBody = document.getElementById('boardBody');

(async function seedIfEmpty(){
  try{
    const snap = await get(profilesRef);
    if(!snap.exists()){
      for(const p of SEED_PROFILES) await push(profilesRef, p);
    }
    const fieldsSnap = await get(customFieldsRef);
    if(!fieldsSnap.exists()){
      for(const label of SEED_CUSTOM_FIELDS) await push(customFieldsRef, label);
    }
  }catch(e){
    console.error('seed failed', e);
    dbStatus.textContent = '数据库初始化失败：' + e.message;
  }
})();

onValue(profilesRef, snap => {
  const val = snap.val() || {};
  PROFILES = Object.entries(val)
    .map(([id, data]) => ({ id, ...data }))
    .sort((a, b) => String(a.code).localeCompare(String(b.code)));
  render();
  dbStatus.textContent = '';
}, err => {
  console.error(err);
  dbStatus.textContent = '数据库连接失败：' + err.message;
});

onValue(customFieldsRef, snap => {
  const val = snap.val() || {};
  CUSTOM_FIELDS = Object.entries(val)
    .map(([id, label]) => ({ id, label }))
    .sort((a, b) => a.id.localeCompare(b.id));
  render();
  renderFieldManageList();
}, err => {
  console.error(err);
});

/* ---------- Add / edit / delete UI ---------- */
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const profileForm = document.getElementById('profileForm');
let editingId = null;

const LIST_FIELDS = ['tags','interests','bonus','dealbreaker'];
const customFieldsContainer = document.getElementById('customFieldsContainer');

function openModal(profile){
  editingId = profile ? profile.id : null;
  modalTitle.textContent = profile ? `编辑 ${profile.code}` : '新增一位';
  profileForm.reset();
  if(profile){
    for(const [key, val] of Object.entries(profile)){
      const input = profileForm.elements[key];
      if(!input) continue;
      input.value = LIST_FIELDS.includes(key) && Array.isArray(val) ? val.join(', ') : (val ?? '');
    }
  }
  customFieldsContainer.innerHTML = CUSTOM_FIELDS.map(f => `
    <div class="field full">
      <label>${esc(f.label)}</label>
      <input name="custom__${f.id}" value="${esc(profile && profile.custom ? profile.custom[f.id] : '')}">
    </div>`).join('');
  modalOverlay.classList.add('open');
}
function closeModal(){
  modalOverlay.classList.remove('open');
  editingId = null;
}

document.getElementById('addBtn').addEventListener('click', () => openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if(e.target === modalOverlay) closeModal(); });

profileForm.addEventListener('submit', async e => {
  e.preventDefault();
  const raw = Object.fromEntries(new FormData(profileForm).entries());
  const data = {};
  const custom = {};
  for(const [key, val] of Object.entries(raw)){
    if(key.startsWith('custom__')) custom[key.slice(8)] = val;
    else data[key] = val;
  }
  data.custom = custom;
  for(const key of LIST_FIELDS){
    data[key] = data[key] ? data[key].split(',').map(s => s.trim()).filter(Boolean) : [];
  }
  if(data.height) data.height = isNaN(Number(data.height)) ? data.height : Number(data.height);
  if(data.reqHeightMin) data.reqHeightMin = isNaN(Number(data.reqHeightMin)) ? data.reqHeightMin : Number(data.reqHeightMin);

  try{
    if(editingId){
      await update(ref(db, 'profiles/' + editingId), data);
    }else{
      await push(profilesRef, data);
    }
    closeModal();
  }catch(err){
    alert('保存失败：' + err.message);
  }
});

boardBody.addEventListener('click', async e => {
  const editBtn = e.target.closest('.edit-btn');
  const deleteBtn = e.target.closest('.delete-btn');
  if(editBtn){
    const profile = PROFILES.find(p => p.id === editBtn.dataset.id);
    if(profile) openModal(profile);
  }
  if(deleteBtn){
    const profile = PROFILES.find(p => p.id === deleteBtn.dataset.id);
    if(profile && confirm(`确定删除「${profile.code}」这一行吗？`)){
      try{ await remove(ref(db, 'profiles/' + deleteBtn.dataset.id)); }
      catch(err){ alert('删除失败：' + err.message); }
    }
  }
});

/* ---------- Field management UI ---------- */
const fieldsModalOverlay = document.getElementById('fieldsModalOverlay');
const fieldManageList = document.getElementById('fieldManageList');
const newFieldLabelInput = document.getElementById('newFieldLabel');

function renderFieldManageList(){
  fieldManageList.innerHTML = CUSTOM_FIELDS.length
    ? CUSTOM_FIELDS.map(f => `
        <div class="field-manage-row">
          <span>${esc(f.label)}</span>
          <button type="button" class="icon-btn danger remove-field-btn" data-id="${f.id}" title="删除字段">✕</button>
        </div>`).join('')
    : '<span class="empty">暂无自定义字段</span>';
}

document.getElementById('manageFieldsBtn').addEventListener('click', () => {
  renderFieldManageList();
  fieldsModalOverlay.classList.add('open');
});
document.getElementById('closeFieldsBtn').addEventListener('click', () => fieldsModalOverlay.classList.remove('open'));
fieldsModalOverlay.addEventListener('click', e => { if(e.target === fieldsModalOverlay) fieldsModalOverlay.classList.remove('open'); });

document.getElementById('addFieldBtn').addEventListener('click', async () => {
  const label = newFieldLabelInput.value.trim();
  if(!label) return;
  try{
    await push(customFieldsRef, label);
    newFieldLabelInput.value = '';
  }catch(err){
    alert('添加字段失败：' + err.message);
  }
});

fieldManageList.addEventListener('click', async e => {
  const btn = e.target.closest('.remove-field-btn');
  if(!btn) return;
  const field = CUSTOM_FIELDS.find(f => f.id === btn.dataset.id);
  if(!field || !confirm(`确定删除字段「${field.label}」吗？所有人在这个字段下填写的内容也会一起删掉。`)) return;
  try{
    await remove(ref(db, 'customFields/' + field.id));
    for(const p of PROFILES){
      if(p.custom && field.id in p.custom){
        await remove(ref(db, 'profiles/' + p.id + '/custom/' + field.id));
      }
    }
  }catch(err){
    alert('删除字段失败：' + err.message);
  }
});
</script>
</body>
</html>
