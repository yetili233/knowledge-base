<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组局本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A44;
    --ink-soft:#384868;
    --paper:#FFFDF8;
    --bg:#F3ECDD;
    --coral:#E8603C;
    --coral-soft:#FBDCD1;
    --sage:#5B8266;
    --sage-soft:#DCE8DE;
    --mustard:#D9A441;
    --mustard-soft:#F6E4C2;
    --line: rgba(31,42,68,0.14);
    --shadow: 0 6px 16px rgba(31,42,68,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Noto Sans SC', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ---------- Header ---------- */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:22px 24px 20px;
    position:sticky; top:0; z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:28px; margin:0; letter-spacing:1px;}
  .brand span{font-size:12px; color:#C9D2E8; letter-spacing:1px;}
  .header-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

  .view-toggle{display:flex; background:rgba(255,255,255,0.08); border-radius:999px; padding:3px;}
  .view-toggle button{
    border:none; background:transparent; color:#C9D2E8; padding:7px 14px; border-radius:999px;
    font-family:'Noto Sans SC'; font-size:13px; cursor:pointer; font-weight:600;
  }
  .view-toggle button.active{background:var(--coral); color:#fff;}

  .btn-stats{background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.25); padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-weight:600;}
  .btn-add{
    background:var(--coral); color:#fff; border:none; padding:10px 18px; border-radius:999px;
    font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:6px;
    box-shadow:0 4px 10px rgba(232,96,60,0.35);
  }
  .btn-add:hover{filter:brightness(1.06);}

  .filters{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center;}
  @media (max-width:640px){
    header{transition:padding .25s ease;}
    .filters{max-height:200px; opacity:1; overflow:hidden; transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease;}
    .brand span{transition:opacity .2s ease;}
    header.collapsed{padding-top:14px; padding-bottom:12px;}
    header.collapsed .filters{max-height:0; opacity:0; margin-top:0; pointer-events:none;}
    header.collapsed .brand span{display:none;}
    .view-toggle{display:none;}
    .btn-add{display:none;}
    main{padding-bottom:88px;}
  }

  .mobile-tabbar{display:none;}
  .mobile-fab{display:none;}
  @media (max-width:640px){
    .mobile-tabbar{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:var(--ink); box-shadow:0 -4px 14px rgba(0,0,0,0.18);
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .mtab{
      flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
      background:none; border:none; color:#8b96b8; padding:6px 4px; border-radius:12px;
      font-family:'Noto Sans SC'; cursor:pointer;
    }
    .mtab-icon{font-size:20px; line-height:1;}
    .mtab-label{font-size:11px; font-weight:600;}
    .mtab.active{background:rgba(255,255,255,0.12); color:#fff;}
    .mobile-fab{
      display:flex; align-items:center; justify-content:center;
      position:fixed; right:18px; bottom:74px; z-index:31;
      width:56px; height:56px; border-radius:50%;
      background:var(--coral); color:#fff; border:none; font-size:26px; font-weight:700;
      box-shadow:0 6px 16px rgba(232,96,60,0.45); cursor:pointer;
    }
  }
  .search-box{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); border-radius:999px;
    padding:7px 14px; color:#fff; font-size:13px; min-width:160px;
  }
  .search-box::placeholder{color:#9FAAC6;}
  .tag-chip{
    padding:6px 13px; border-radius:999px; font-size:12px; cursor:pointer; border:1px solid rgba(255,255,255,0.2);
    color:#C9D2E8; background:transparent; white-space:nowrap;
  }
  .tag-chip.active{background:var(--mustard); color:var(--ink); border-color:var(--mustard); font-weight:700;}

  main{max-width:1180px; margin:0 auto; padding:26px 20px 60px;}

  /* ---------- Kanban ---------- */
  .kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  @media (max-width:900px){.kanban{grid-template-columns:1fr;}}

  .column{background:rgba(255,255,255,0.35); border-radius:16px; padding:14px; min-height:120px;}
  .column-head{display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:0 4px;}
  .column-head .dot{width:10px; height:10px; border-radius:50%;}
  .column-head h2{font-size:16px; margin:0; font-weight:700;}
  .column-head .count{
    margin-left:auto; font-size:12px; font-family:'JetBrains Mono'; background:var(--ink); color:#fff;
    padding:2px 9px; border-radius:999px;
  }
  .col-proposed .dot{background:var(--mustard);}
  .col-upcoming .dot{background:var(--coral);}
  .col-completed .dot{background:var(--sage);}

  .empty-hint{
    color:var(--ink-soft); font-size:13px; text-align:center; padding:28px 10px; opacity:0.6;
  }

  /* ---------- Ticket Card ---------- */
  .card{
    background:var(--paper); border-radius:12px; margin-bottom:12px; display:flex;
    box-shadow:var(--shadow); position:relative; cursor:pointer; overflow:hidden;
    border:1px solid var(--line);
    transition:transform .12s ease;
  }
  .card:hover{transform:translateY(-2px);}
  .card.status-completed{filter:grayscale(0.65); opacity:0.8;}
  .card.status-completed:hover{filter:grayscale(0.35); opacity:0.95;}
  .stub{
    width:64px; flex:none; background:var(--ink); color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:8px 4px; position:relative;
  }
  .stub .day{font-family:'JetBrains Mono'; font-size:22px; font-weight:700; line-height:1;}
  .stub .mon{font-size:11px; color:#C9D2E8; margin-top:2px;}
  .stub .tbd{font-size:11px; color:#C9D2E8; text-align:center; line-height:1.4; padding:0 4px;}
  .perforation{
    position:absolute; right:-1px; top:0; bottom:0; width:1px;
    background-image:linear-gradient(var(--bg) 50%, transparent 0%);
    background-size: 1px 8px; background-repeat:repeat-y;
  }
  .card-body{padding:12px 14px 12px 18px; flex:1; min-width:0;}
  .card-title{font-size:16px; font-weight:700; margin:0; flex:1; min-width:0; overflow-wrap:break-word;}
  .card-title-row{display:flex; align-items:flex-start; gap:8px; padding-right:52px; margin-bottom:6px;}
  .card-thumb{width:36px; height:36px; border-radius:8px; object-fit:cover; flex:none;}
  .card-meta{display:flex; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
  .card-meta span{display:flex; align-items:center; gap:3px;}
  .card-foot{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap;}
  .tag-pill{
    background:var(--sage-soft); color:#33533F; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600;
  }
  .stamp{
    position:absolute; top:10px; right:10px; width:52px; height:52px; border-radius:50%;
    border:2px dashed; display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'JetBrains Mono'; font-weight:700; font-size:10px; transform:rotate(-10deg); line-height:1.1;
    padding:2px;
  }
  .stamp.proposed{border-color:var(--mustard); color:var(--mustard);}
  .stamp.upcoming{border-color:var(--coral); color:var(--coral);}
  .stamp.completed{border-color:var(--sage); color:var(--sage);}
  .avatars{display:flex; gap:4px; flex-wrap:wrap;}
  .avatar-chip{background:var(--mustard-soft); color:#7A5A17; padding:1px 8px; border-radius:999px; font-size:11px;}
  .comment-count{display:flex; align-items:center; gap:3px; margin-left:auto;}
  .quick-vote{background:var(--mustard-soft); color:#7A5A17; border:none; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; cursor:pointer;}
  .countdown{color:var(--coral); font-weight:700;}

  /* ---------- Calendar ---------- */
  .cal-wrap{background:rgba(255,255,255,0.35); border-radius:16px; padding:18px;}
  .cal-nav{display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px;}
  .cal-nav button{background:var(--ink); color:#fff; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:15px;}
  .cal-nav h2{margin:0; font-size:18px; min-width:120px; text-align:center;}
  .cal-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(92px,1fr)); gap:6px;}
  .cal-dow{text-align:center; font-size:12px; color:var(--ink-soft); font-weight:700; padding-bottom:4px;}
  .cal-cell{
    background:var(--paper); border-radius:10px; min-height:92px; padding:6px; font-size:12px; position:relative;
    border:1px solid var(--line); cursor:default; min-width:0;
  }
  .cal-cell.empty{background:transparent; border:none;}
  .cal-cell.today{outline:2px solid var(--coral);}
  .cal-daynum-row{display:flex; align-items:center; justify-content:space-between;}
  .cal-daynum{font-family:'JetBrains Mono'; font-weight:700; font-size:12px; color:var(--ink-soft);}
  .cal-add-btn{
    background:none; border:none; color:var(--ink-soft); font-size:14px; font-weight:700; cursor:pointer;
    padding:0 2px; line-height:1; opacity:0.45;
  }
  .cal-add-btn:hover{opacity:1; color:var(--coral);}
  .cal-events{display:flex; flex-direction:column; gap:3px; margin-top:5px;}
  .cal-event{
    font-size:11px; line-height:1.3; padding:2px 5px; border-radius:5px; background:var(--bg);
    border-left:3px solid; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
  }
  .cal-event:hover{filter:brightness(0.96);}
  .cal-event-time{font-family:'JetBrains Mono'; font-weight:700; margin-right:3px; opacity:0.75;}
  .cal-event-more{font-size:10px; color:var(--ink-soft); padding-left:5px;}
  .cal-cell-list{cursor:pointer;}
  .cal-cell-list:hover{box-shadow:var(--shadow);}

  /* ---------- Album ---------- */
  .album-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
  .album-card{background:var(--paper); border-radius:12px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); border:1px solid var(--line);}
  .album-card:hover{transform:translateY(-2px);}
  .album-cover{height:110px; background-size:cover; background-position:center; background-color:var(--sage-soft); display:flex; align-items:center; justify-content:center;}
  .album-fallback{font-size:34px;}
  .album-info{padding:8px 10px;}
  .album-title{font-size:13px; font-weight:700; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .album-meta{font-size:11px; color:var(--ink-soft); margin:0;}

  /* ---------- Footer stats ---------- */
  .stats{text-align:center; color:var(--ink-soft); font-size:13px; margin-top:24px; font-family:'JetBrains Mono';}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(31,42,68,0.55); display:none; align-items:flex-start; justify-content:center;
    z-index:100; padding:40px 16px; overflow-y:auto;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper); border-radius:18px; width:100%; max-width:560px; padding:26px; position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .modal h2{margin:0 0 18px; font-size:20px;}
  .modal-close{position:absolute; top:16px; right:18px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); font-family:'Noto Sans SC';
    font-size:14px; background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .cover-row{display:flex; gap:6px;}
  .cover-row input{flex:1; min-width:0;}
  .cover-row .btn-secondary{padding:9px 12px; white-space:nowrap; flex:none;}
  #coverPreview{margin-top:8px; max-height:80px; border-radius:8px; display:block;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
  .form-actions{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .btn-primary{
    background:var(--coral); color:#fff; border:none; padding:10px 22px; border-radius:999px; font-weight:700;
    cursor:pointer; font-size:14px;
  }
  .btn-secondary{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line); padding:10px 18px; border-radius:999px;
    cursor:pointer; font-size:14px;
  }
  .btn-danger{color:var(--coral); background:none; border:none; cursor:pointer; font-size:13px; text-decoration:underline;}

  .status-btns{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .status-btn{
    flex:1; padding:8px; border-radius:9px; border:1.5px solid var(--line); background:#fff; cursor:pointer;
    font-size:12px; font-weight:700; text-align:center; color:var(--ink-soft);
  }
  .status-btn.sel-proposed{border-color:var(--mustard); background:var(--mustard-soft); color:#7A5A17;}
  .status-btn.sel-upcoming{border-color:var(--coral); background:var(--coral-soft); color:#A8402A;}
  .status-btn.sel-completed{border-color:var(--sage); background:var(--sage-soft); color:#33533F;}

  .section-title{font-size:13px; font-weight:700; color:var(--ink-soft); margin:18px 0 8px; border-top:1px dashed var(--line); padding-top:16px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .name-chip{background:var(--mustard-soft); color:#7A5A17; padding:3px 10px; border-radius:999px; font-size:12px; display:flex; align-items:center; gap:5px;}
  .name-chip button{background:none; border:none; cursor:pointer; color:#7A5A17; font-size:12px; padding:0;}
  .member-chip{
    padding:7px 15px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft);
  }
  .member-chip.active{background:var(--mustard-soft); border-color:var(--mustard); color:#7A5A17;}
  .add-inline{display:flex; gap:8px;}
  .add-inline input{flex:1;}
  .add-inline button{
    background:var(--ink); color:#fff; border:none; padding:0 16px; border-radius:9px; font-size:13px; cursor:pointer;
  }
  .comment{background:#F8F4E9; border-radius:10px; padding:8px 12px; margin-bottom:8px; font-size:13px;}
  .comment b{color:var(--ink);}
  .comment .time{font-size:11px; color:var(--ink-soft); float:right;}
  .stars{display:flex; gap:4px; margin-bottom:10px;}
  .star{font-size:22px; cursor:pointer; color:#D8D0BE;}
  .star.on{color:var(--mustard);}
  .split-info{font-size:12px; color:var(--ink-soft); margin:-6px 0 14px;}
  .stat-row{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px;}
  .stat-bar-bg{flex:1; background:var(--bg); border-radius:6px; overflow:hidden; height:10px;}
  .stat-bar-fill{height:100%; background:var(--coral);}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <h1 class="display">组局本</h1>
      <span>记录我们下一场好玩的</span>
    </div>
    <div class="header-actions">
      <div class="view-toggle">
        <button id="tabKanban" class="active">看板</button>
        <button id="tabCalendar">日历</button>
        <button id="tabAlbum">相册</button>
      </div>
      <button class="btn-stats" id="btnStats">📊 统计</button>
      <button class="btn-add" id="btnAdd">＋ 提议新计划</button>
    </div>
  </div>
  <div class="filters">
    <input class="search-box" id="searchInput" placeholder="搜索活动 / 地点...">
    <div id="tagFilterRow" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
  </div>
</header>

<nav class="mobile-tabbar" id="mobileTabbar">
  <button class="mtab active" data-view="kanban"><span class="mtab-icon">📋</span><span class="mtab-label">看板</span></button>
  <button class="mtab" data-view="calendar"><span class="mtab-icon">📅</span><span class="mtab-label">日历</span></button>
  <button class="mtab" data-view="album"><span class="mtab-icon">🖼️</span><span class="mtab-label">相册</span></button>
</nav>
<button class="mobile-fab" id="mobileFab">＋</button>

<main>
  <div id="kanbanView" class="kanban"></div>
  <div id="calendarView" class="cal-wrap" style="display:none;"></div>
  <div id="albumView" style="display:none;"></div>
  <div class="stats" id="statsLine"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAOxzjsKxBR7Y3x1CcUO470nCttsDj_gF4",
    authDomain: "calendar-33a5a.firebaseapp.com",
    databaseURL: "https://calendar-33a5a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "calendar-33a5a",
    storageBucket: "calendar-33a5a.firebasestorage.app",
    messagingSenderId: "108518441596",
    appId: "1:108518441596:web:78bb8fae9621cdc14e7ff9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const fb = { db, ref, get, set, remove, onValue };
  if(window.__fbResolve) window.__fbResolve(fb);
  else window.__fb = fb;
</script>

<script>
window.__fbReady = window.__fb ? Promise.resolve(window.__fb) : new Promise(resolve=>{ window.__fbResolve = resolve; });

const TAGS = ['桌游','剧本杀','看展','谷子淘货','攀岩','拳击','聚餐','旅行','演唱会','看电影','密室逃脱','其他'];
const GROUP_MEMBERS = ['欧尼','yeti','qq','jj'];
const WEEKDAY_NAMES = ['周日','周一','周二','周三','周四','周五','周六'];
const TAG_EMOJI = {'桌游':'🎲','剧本杀':'🕵️','看展':'🖼️','谷子淘货':'🧸','攀岩':'🧗','拳击':'🥊','聚餐':'🍜','旅行':'✈️','演唱会':'🎤','看电影':'🎬','密室逃脱':'🔐','其他':'✨'};
const STATUS_META = {
  proposed:{label:'待定', color:'#D9A441'},
  upcoming:{label:'待进行', color:'#E8603C'},
  completed:{label:'已完成', color:'#5B8266'}
};
let plans = [];
let currentView = 'kanban';
let activeTags = new Set();
let searchQuery = '';
let calCursor = new Date();
let myName = '';
let plansLoaded = false;

async function loadMyName(){
  try{ myName = localStorage.getItem('my-name') || ''; }
  catch(e){ myName = ''; }
}
async function saveMyName(name){
  myName = name;
  try{ localStorage.setItem('my-name', name); }catch(e){}
}
async function saveSinglePlan(p){
  try{
    const {db, ref, set} = await window.__fbReady;
    await set(ref(db, 'plans/' + p.id), p);
    return true;
  }catch(e){ console.error('保存失败', e); return false; }
}
async function deletePlanRemote(id){
  try{
    const {db, ref, remove} = await window.__fbReady;
    await remove(ref(db, 'plans/' + id));
    return true;
  }catch(e){ console.error('删除失败', e); return false; }
}
function subscribePlans(){
  (async ()=>{
    const {db, ref, set, onValue} = await window.__fbReady;
    onValue(ref(db, 'plans'), async snap=>{
      const val = snap.val();
      if(Array.isArray(val)){
        const keyed = {};
        val.forEach(p=>{ if(p && p.id) keyed[p.id] = p; });
        await set(ref(db, 'plans'), keyed);
        return;
      }
      plans = val ? Object.values(val) : [];
      plansLoaded = true;
      renderAll();
    }, err=>{
      console.error('同步失败', err);
      plansLoaded = true;
      renderAll();
    });
  })();
}

function uid(){ return 'p_' + Date.now() + '_' + Math.floor(Math.random()*10000); }
function resizeImageToDataURL(file, maxDim=900, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else{ w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('图片加载失败'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtStub(dateStr){
  if(!dateStr) return {day:'?', mon:'待定'};
  const d = new Date(dateStr+'T00:00:00');
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  return {day:String(d.getDate()), mon:months[d.getMonth()]};
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function countdownLabel(dateStr){
  const days = daysUntil(dateStr);
  if(days===null) return '';
  if(days>1) return `还有${days}天`;
  if(days===1) return '明天';
  if(days===0) return '就是今天';
  return `已过${-days}天`;
}
function matchesFilter(p){
  if(activeTags.size>0 && !activeTags.has(p.tag)) return false;
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    const hay = (p.title+' '+p.location).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function sortPlans(list){
  return list.slice().sort((a,b)=>{
    if(!a.date && !b.date) return 0;
    if(!a.date) return 1;
    if(!b.date) return -1;
    return a.date.localeCompare(b.date);
  });
}

function renderTagFilters(){

}

async function quickVote(id){
  let name = myName;
  if(!name){
    name = prompt('你的名字是？（下次会记住，不用再填）') || '';
    if(!name) return;
    await saveMyName(name);
  }
  const p = plans.find(x=>x.id===id);
  if(!p) return;
  p.interested = p.interested || [];
  const idx = p.interested.indexOf(name);
  if(idx>=0) p.interested.splice(idx,1); else p.interested.push(name);
  const ok = await saveSinglePlan(p);
  if(!ok) alert('保存失败了，检查一下网络，稍后再试一次？');
  renderAll();
}

function renderCalendar(){
  const el = document.getElementById('calendarView');
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const weekday = new Date(y,m,d).getDay();
    const dayPlans = sortPlans(plans.filter(p=>planIsOnDate(p, dateStr, weekday) && matchesFilter(p)));
    const shown = dayPlans.slice(0,3);
    const events = shown.map(p=>`<div class="cal-event" style="border-left-color:${STATUS_META[p.status].color}" data-id="${p.id}">${p.recurring?'🔁 ':''}${p.time?`<span class="cal-event-time">${escapeHtml(p.time)}</span>`:''}${escapeHtml(p.title)}</div>`).join('');
    const more = dayPlans.length>3 ? `<div class="cal-event-more">+${dayPlans.length-3} 更多</div>` : '';
    cells += `<div class="cal-cell ${dayPlans.length?'cal-cell-list':''} ${dateStr===todayStr?'today':''}" data-date="${dateStr}">
      <div class="cal-daynum-row"><span class="cal-daynum">${d}</span><button type="button" class="cal-add-btn" data-date="${dateStr}">＋</button></div>
      <div class="cal-events">${events}${more}</div>
    </div>`;
  }

  el.innerHTML = `
    <div class="cal-nav">
      <button id="calPrev">‹</button>
      <h2 class="display">${y} 年 ${m+1} 月</h2>
      <button id="calNext">›</button>
    </div>
    <div class="cal-scroll">
      <div class="cal-grid">
        ${['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>`;

  document.getElementById('calPrev').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });
  el.querySelectorAll('.cal-cell-list').forEach(cell=>{
    cell.addEventListener('click', ()=> openDayList(cell.dataset.date));
  });
  el.querySelectorAll('.cal-event').forEach(ev=>{
    ev.addEventListener('click', (e)=>{ e.stopPropagation(); openDetailModal(ev.dataset.id); });
  });
  el.querySelectorAll('.cal-add-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openAddModal(btn.dataset.date); });
  });
}

    <div class="section-title">参与的人</div>
    <div class="chip-row" id="participantChips">
      ${GROUP_MEMBERS.map(n=>`<button type="button" class="member-chip ${(p.participants||[]).includes(n)?'active':''}" data-name="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join('')}
    </div>

    ${(p.interested&&p.interested.length) ? `
    <div class="section-title">点过"我有空"的人</div>
    <div class="chip-row">${p.interested.map(n=>`<span class="name-chip" style="background:var(--coral-soft);color:#A8402A;">${escapeHtml(n)}</span>`).join('')}</div>
    ` : ''}

    <div id="memorySection" style="display:${p.status==='completed'?'block':'none'}">
      <div class="field"><label>回忆一下</label><textarea id="d_memory" placeholder="这次感觉怎么样">${escapeHtml(p.memoryNote||'')}</textarea></div>
    </div>

    <div class="section-title">留言 / 讨论</div>
    <div id="commentsList">
      ${(p.comments||[]).map(c=>`<div class="comment"><span class="time">${c.time}</span><b>${escapeHtml(c.name||'匿名')}：</b>${escapeHtml(c.text)}</div>`).join('') || '<p style="font-size:12px;color:var(--ink-soft);">还没有留言，来说两句吧</p>'}
    </div>
    <div class="add-inline" style="margin-top:8px;">
      <input id="newCommentName" placeholder="你的名字" value="${escapeHtml(myName)}" style="max-width:100px;">
      <input id="newCommentText" placeholder="说点什么...">
      <button id="addCommentBtn">发送</button>
    </div>

    <div class="form-actions">
      <button class="btn-primary" id="saveDetail">保存修改</button>
      <button class="btn-secondary" id="copyTextBtn">📋 复制文字</button>
      <button class="btn-secondary" id="exportBtn">📤 导出分享图</button>
      <button class="btn-secondary" onclick="closeModal()">关闭</button>
      <button class="btn-danger" id="deletePlanBtn" style="margin-left:auto;">删除这个计划</button>
    </div>
  `;

  function syncDetailFields(){
    p.recurring = document.getElementById('d_recurring').checked;
    if(p.recurring){
      p.date = '';
      p.recurWeekday = parseInt(document.getElementById('d_weekday').value);
    }else{
      p.date = document.getElementById('d_date').value;
      p.recurWeekday = null;
    }
    p.time = document.getElementById('d_time').value.trim();
    p.location = document.getElementById('d_location').value.trim();
    p.tag = document.getElementById('d_tag').value;
    p.proposer = document.getElementById('d_proposer').value.trim();
    p.budget = document.getElementById('d_budget').value.trim();
    p.actualCost = document.getElementById('d_actualCost').value.trim();
    p.coverImage = document.getElementById('d_cover').value.trim();
    p.notes = document.getElementById('d_notes').value.trim();
    if(document.getElementById('d_memory')) p.memoryNote = document.getElementById('d_memory').value.trim();
  }

  document.getElementById('d_recurring').addEventListener('change', (e)=>{
    const on = e.target.checked;
    document.getElementById('d_dateField').style.display = on ? 'none' : '';
    document.getElementById('d_weekdayField').style.display = on ? '' : 'none';
  });

  document.getElementById('coverUploadBtn').addEventListener('click', ()=>{
    document.getElementById('d_cover_file').click();
  });
  document.getElementById('d_cover_file').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageToDataURL(file);
      document.getElementById('d_cover').value = dataUrl;
      const preview = document.getElementById('coverPreview');
      preview.src = dataUrl;
      preview.style.display = 'block';
    }catch(err){
      alert('图片处理失败，换一张试试？');
    }
  });

  function updateSplitDisplay(){
    const val = parseFloat(document.getElementById('d_actualCost').value);
    const n = (p.participants||[]).length || 1;
    const info = document.getElementById('splitInfo');
    info.textContent = (!isNaN(val) && val>0) ? `人均约 ¥${(val/n).toFixed(1)}（按 ${n} 人分摊）` : '';
  }
  updateSplitDisplay();
  document.getElementById('d_actualCost').addEventListener('input', updateSplitDisplay);

  modal.querySelectorAll('.status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      syncDetailFields();
      p.status = btn.dataset.s;
      openDetailModal(id);
    });
  });

  modal.querySelectorAll('.member-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      syncDetailFields();
      const name = btn.dataset.name;
      p.participants = p.participants || [];
      const idx = p.participants.indexOf(name);
      if(idx>=0) p.participants.splice(idx,1); else p.participants.push(name);
      openDetailModal(id);
    });
  });

  document.getElementById('addCommentBtn').addEventListener('click', ()=>{
    const name = document.getElementById('newCommentName').value.trim() || '匿名';
    const text = document.getElementById('newCommentText').value.trim();
    if(!text) return;
    syncDetailFields();
    p.comments = p.comments || [];
    const now = new Date();
    p.comments.push({name, text, time:`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`});
    saveMyName(name);
    openDetailModal(id);
  });


  document.getElementById('deletePlanBtn').addEventListener('click', async ()=>{
    if(confirm('确定要删除这个计划吗？')){
      const ok = await deletePlanRemote(id);
      if(!ok){ alert('删除失败了，检查一下网络，稍后再试一次？'); return; }
      plans = plans.filter(x=>x.id!==id);
      closeModal();
      renderAll();
    }
  });

  document.getElementById('copyTextBtn').addEventListener('click', ()=> copyPlanText(id));
  document.getElementById('exportBtn').addEventListener('click', ()=> exportShareCard(id));

  document.getElementById('saveDetail').addEventListener('click', async ()=>{
    syncDetailFields();
    const ok = await saveSinglePlan(p);
    if(!ok){ alert('保存失败了，检查一下网络，稍后再试一次？'); return; }
    closeModal();
    renderAll();
  });

  document.getElementById('overlay').classList.add('show');
}

let html2canvasLoadPromise = null;
function loadHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  if(!html2canvasLoadPromise){
    html2canvasLoadPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  return html2canvasLoadPromise;
}

async function copyPlanText(id){
  const p = plans.find(x=>x.id===id);
  if(!p) return;
  const lines = [];
  lines.push(`${TAG_EMOJI[p.tag]||'✨'} ${p.title}`);
  lines.push(`📅 ${p.date||'日期待定'}${p.time?(' '+p.time):''}`);
  if(p.location) lines.push(`📍 ${p.location}`);
  if(p.participants && p.participants.length) lines.push(`👥 ${p.participants.join('、')}`);
  if(p.budget) lines.push(`💰 人均预算 ${p.budget}`);
  if(p.notes) lines.push(`📝 ${p.notes}`);
  if(p.status==='completed' && p.rating) lines.push(`${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}`);
  lines.push('—— 来自组局本');
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    alert('已复制，去粘贴发给大家吧');
  }catch(e){
    prompt('复制失败，手动复制这段文字：', text);
  }
}

async function exportShareCard(id){
  const p = plans.find(x=>x.id===id);
  if(!p) return;
  try{ await loadHtml2Canvas(); }
  catch(e){ alert('导出功能加载失败，检查一下网络再试试？'); return; }
  const temp = document.createElement('div');
  temp.style.cssText = 'position:fixed; left:-9999px; top:0; width:360px;';
  temp.innerHTML = `
    <div style="font-family:'Noto Sans SC',sans-serif; background:#FFFDF8; border-radius:20px; padding:24px; border:2px solid #1F2A44;">
      <div style="font-family:'ZCOOL KuaiLe',cursive; font-size:22px; color:#1F2A44; margin-bottom:10px;">${escapeHtml(p.title)}</div>
      <div style="font-size:13px; color:#46536B; margin-bottom:6px;">📅 ${p.date||'日期待定'} ${p.time?(' '+p.time):''}</div>
      <div style="font-size:13px; color:#46536B; margin-bottom:6px;">📍 ${escapeHtml(p.location||'待定')}</div>
      <div style="font-size:13px; color:#46536B; margin-bottom:12px;">${TAG_EMOJI[p.tag]||''} ${p.tag||''}</div>
      ${(p.participants&&p.participants.length)?`<div style="font-size:13px; color:#46536B;">👥 ${p.participants.map(n=>escapeHtml(n)).join('、')}</div>`:''}
      ${p.status==='completed'?`<div style="margin-top:10px; color:#D9A441; font-size:16px;">${'★'.repeat(p.rating||0)}${'☆'.repeat(5-(p.rating||0))}</div>`:''}
      <div style="margin-top:16px; font-size:11px; color:#9aa3b8; text-align:right;">来自组局本</div>
    </div>`;
  document.body.appendChild(temp);
  try{
    const canvas = await html2canvas(temp.firstElementChild, {scale:2, backgroundColor:null});
    const link = document.createElement('a');
    link.download = `${p.title}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    alert('导出失败了，可能是封面图片链接跨域限制导致的，去掉封面图再试试？');
  }
  document.body.removeChild(temp);
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
